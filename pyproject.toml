[project]
name = "local-genai-lab"
version = "0.1.0"
description = "A local GenAI chat API using FastAPI and Ollama."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "pydantic-settings>=2.7,<3",
    "langchain-ollama>=1,<2",
    "httpx>=0.28,<1",
    "ollama>=0.6,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "langchain-core>=1,<2",
    "ruff>=0.11,<1",
    "ipykernel>=7.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/genai_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: requires a running Ollama server and downloaded model"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
